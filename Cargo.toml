[package]
name = "astra"
version = "0.1.0"
edition = "2024"
authors = ["Thoisoi Three"]
license = "AGPL-3.0-only"
readme = "README.md"
description = "Astra: a native molecular viewer built with Rust and wgpu"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
flate2 = "1"
glam = "0.33"
pollster = "1"
prost = "0.14"
rfd = "0.17"
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
wgpu = "30"
winit = "0.30"
zstd = "0.13"

# FXC can reject the data-dependent loops and barriers in the DoF compute pass.
# Link DXC into Windows MSVC builds rather than relying on DLLs on the user's PATH.
[target.'cfg(all(target_os = "windows", target_env = "msvc", not(target_arch = "aarch64")))'.dependencies]
wgpu = { version = "30", features = ["static-dxc"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
resvg = { version = "0.45", default-features = false }
winresource = "0.1"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[[bench]]
name = "display_memory"
harness = false

[profile.release]
lto = "thin"
