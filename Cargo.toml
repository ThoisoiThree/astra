[package]
name = "molview"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A lightweight native molecular viewer built with Rust and wgpu"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
flate2 = "1"
glam = "0.33"
pollster = "1"
prost = "0.14"
rfd = "0.17"
rmpv = "1"
thiserror = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
wgpu = "30"
winit = "0.30"
zstd = "0.13"

[profile.release]
lto = "thin"
