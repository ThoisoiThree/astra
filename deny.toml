# cargo-deny configuration: `cargo deny check` runs in CI on every push.

[graph]
all-features = false

[advisories]
# Fetch the RustSec database with the git CLI so corporate proxies and custom CAs work.
git-fetch-with-cli = true
# Every advisory, including unmaintained and unsound crates, fails the check unless it is
# listed below with a justification.
unmaintained = "all"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
